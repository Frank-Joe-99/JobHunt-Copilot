# ==============================================================================
# 系统运行与大模型配置示例模板 (Settings Template)
# 请复制此文件为 settings.yaml 并填入您的 API Key 与运行参数
# ==============================================================================

app:
  name: "JobHunt-Copilot"
  version: "0.1.0"
  log_level: "INFO"                    # DEBUG, INFO, WARNING, ERROR

llm:
  # 默认使用的大模型供应商 (支持: deepseek, openai, claude, gemini, ollama)
  default_provider: "deepseek"
  
  providers:
    deepseek:
      api_key: "sk-your-deepseek-api-key"
      base_url: "https://api.deepseek.com"
      model: "deepseek-flash"          # DeepSeek-V4.1-Flash
      temperature: 0.6
      max_tokens: 40960
      
    openai:
      api_key: "sk-your-openai-api-key"
      base_url: "https://api.openai.com/v1"
      model: "gpt-4o"
      temperature: 0.3
      max_tokens: 4096
      # 按实际端点能力配置；temperature: null 或 supports_temperature: false 均可省略采样参数。
      supports_temperature: true
      token_limit_parameter: max_tokens  # 部分端点显式使用 max_completion_tokens
      output_token_limit: null          # 超过配置上限时报错，不静默截断
      context_char_limit: 100000        # 应用输入字符预算，不代表模型 token 窗口
      supports_json_mode: null          # true/false 显式指定；null 沿用供应商兼容默认
      supports_json_schema: false       # 经端点验证后才能设 true；不按模型名猜测
      structured_output: auto           # auto / json_schema / json_object / prompt_json
      allow_format_fallback: true       # 仅明确“不支持格式”才自动降级
      structured_max_attempts: 3        # 网络重试、格式降级、字段重生成共用次数
      structured_total_timeout_seconds: 60
      structured_validation_retries: 0 # 可显式启用最多 2 次字段重生成，仍受总预算约束
      structured_max_response_bytes: 2000000
      format_cache_ttl_seconds: 86400   # 0 禁用能力缓存；缓存不保存正文或密钥
      capability_revision: "1"         # 更新此值使旧能力缓存失效

    claude:
      api_key: "sk-ant-your-claude-api-key"
      model: "claude-3-5-sonnet-20241022"
      temperature: 0.3

    gemini:
      api_key: "your-gemini-api-key"
      model: "gemini-1.5-pro"
      temperature: 0.3

resume_generation:
  engine: "typst"                      # 推荐使用 typst，也可以使用 html
  default_template: "modern"           # 默认模版名称
  page_limit: 1                        # 强约束：A4 纸一页之内

github:
  token: ""                            # 提高 GitHub API 速率限制（可选）
  offline: false                       # 只关闭 GitHub 网络；大模型调用另行控制
  max_requests: 6
  max_search_requests: 3
  max_readmes: 2
  request_timeout_seconds: 8
  total_timeout_seconds: 20
  max_response_bytes: 512000
  max_download_bytes: 1500000
  readme_excerpt_chars: 6000
  cache_ttl_seconds: 86400
  max_stale_seconds: 604800
