interface:
  display_name: "JD 匹配分析"
  short_description: "对照本地档案分析单个岗位 JD：匹配点、缺口、是否值得投递"
  default_prompt: "Use $jobhunt-jd-analysis to analyze this job description against my profile and tell me whether it is worth applying."

policy:
  # 会把档案与 JD 内容发送给已配置的 LLM 服务商，仅在用户显式 $ 调用时运行。
  allow_implicit_invocation: false
