interface:
  display_name: "单岗位定制申请材料"
  short_description: "针对一个 JD 生成匹配分析、定制简历（PDF/Word）与交付战报"
  default_prompt: "Use $jobhunt-application-package to prepare a tailored resume and report for this job description."

policy:
  # 会写入本地文件并把档案与 JD 内容发送给已配置的 LLM 服务商，仅在用户显式 $ 调用时运行。
  allow_implicit_invocation: false
